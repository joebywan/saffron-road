name: Release

# Builds what a `v*` tag releases: the Android APK. It attaches to the release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the builds to'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes with git; this workflow publishes through the gh
          # CLI with an explicitly scoped GH_TOKEN. Left at the default, every
          # step after this one would inherit push credentials in .git/config -
          # including a Gradle build running third-party plugin code.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      # Every AGP from 8.0 to 9.4 needs a 17 JDK as its minimum, so 17 it is.
      # This used to say Gradle 8.14 could not start on Java 25, which was a
      # ceiling; the wrapper is 9.7 now and the ceiling moved. The floor did
      # not, and the floor is the reason.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Tests must pass before anything ships
        run: npm test

      # THE SERVICE WORKER'S VERSION, for the whole checkout, before anything
      # is built from it. sw.js ships a `__APP_VERSION__` placeholder;
      # this replaces it with the tag plus a hash of the shell's real bytes.
      # Doing it here rather than inside each packager is what makes the APK
      # and the Linux packages of one release say the same thing - the
      # packagers only stamp what is still a placeholder.
      #
      # Without this, sw.js is byte-identical between releases, no browser
      # ever notices a new worker, and an installed app runs its first-ever
      # download for ever. That is not hypothetical; it happened.
      - name: Stamp the service worker version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          node tools/version.js --write . --version "$TAG"
          grep -n "const INJECTED_VERSION" sw.js
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # -PappVersion is what makes the APK's versionName and versionCode come
      # from the release. Without it every APK shipped as versionCode 1, and
      # Android will not install an equal versionCode over an existing app as
      # an upgrade of its assets - so a new release installed over an old one
      # left the OLD web app in place, which is exactly what people saw.
      # THE SIGNING KEY, RESTORED FROM SECRETS. Without this the build falls
      # back to ~/.android/debug.keystore, which Gradle GENERATES when it is
      # missing — and it is always missing on an ephemeral runner. That is how
      # v1.3.0, v1.4.0, v1.5.1 and v1.6.0 each went out under a different
      # random key, none of which could install over another.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set - refusing to ship an APK" >&2
            echo "signed with a throwaway key that nobody can upgrade over." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/saffron-road-release.jks"
          echo "restored $(wc -c < "$RUNNER_TEMP/saffron-road-release.jks") bytes"

      - name: Build APK
        working-directory: android
        env:
          SAFFRON_KEYSTORE: ${{ runner.temp }}/saffron-road-release.jks
          SAFFRON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAFFRON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAFFRON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PappVersion="${{ steps.v.outputs.tag }}"

      # The web app really is inside the binary. A packaging change that
      # silently stopped copying src/ would still produce an APK that installs
      # and then shows nothing.
      - name: Verify the APK carries the web app
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found" >&2; exit 1; }
          MODULES=$(unzip -l "$APK" | grep -c 'assets/src/.*\.js' || true)
          echo "APK carries $MODULES web modules"
          test "$MODULES" -gt 10 || { echo "suspiciously few modules bundled" >&2; exit 1; }

      # The version has to be inside the BINARY, not just in the checkout. An
      # APK whose sw.js still says the placeholder (or the un-injected 'dev'
      # default) would never update on a device, which is the entire bug.
      - name: Verify the APK's service worker is stamped
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SWV=$(unzip -p "$APK" assets/sw.js \
                | sed -n "s/^const INJECTED_VERSION = '\\(.*\\)';.*/\\1/p")
          echo "APK service worker version: ${SWV:-<none>}"
          case "$SWV" in
            ''|dev|dev-*|__*) echo "sw.js in the APK is not stamped with a release version" >&2; exit 1 ;;
          esac

      # THE CHECK THAT WOULD HAVE CAUGHT SHIPPING A DEBUG BUILD.
      #
      # Every release from v1.0.0 to v2.2.0 was assembleDebug, so every one of
      # them carried android:debuggable="true": anyone who could reach the
      # device over adb could attach to the process and read the storage of an
      # app whose whole pitch is that nothing leaves the device. It is also the
      # profile Play Protect scrutinises hardest, which is a plausible reason
      # updates were refused where fresh installs were not.
      #
      # It is invisible from outside — a debuggable APK installs, runs, and
      # looks identical — so it gets a check rather than a habit.
      - name: The APK must not be debuggable
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "This APK is DEBUGGABLE. A debug build must never be released:" >&2
            echo "it exposes the app to adb and is what Play Protect blocks." >&2
            exit 1
          fi
          echo "not debuggable"

      # versionCode is the value Android compares on install. A release that
      # ships the same one as the release before it is a release nobody can
      # install over the top - it looks like the update simply did nothing.
      - name: Verify the APK's versionCode and versionName
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          LINE=$("$AAPT" dump badging "$APK" | head -1)
          echo "$LINE"
          CODE=$(echo "$LINE" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          NAME=$(echo "$LINE" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")
          WANT="${{ steps.v.outputs.tag }}"; WANT="${WANT#v}"
          test "$NAME" = "$WANT" || { echo "versionName '$NAME' is not the tag '$WANT'" >&2; exit 1; }
          test "${CODE:-1}" -gt 1 || { echo "versionCode is still $CODE - releases cannot install over each other" >&2; exit 1; }
          echo "versionCode $CODE, versionName $NAME"

      # THE CHECK THAT WOULD HAVE CAUGHT THIS ON THE FIRST CI RELEASE. A key
      # that quietly changes produces an APK that is perfectly valid, passes
      # every other check here, and simply will not install over the one before
      # it. So the identity is asserted rather than assumed: the fingerprint in
      # android/release-key.sha256 is the certificate's SHA-256, a PUBLIC value,
      # and it must not change without somebody deciding it should.
      # Read with tools/apk-cert.js rather than `apksigner verify --print-certs`.
      # apksigner printed NOTHING on this runner - no digest, no error, no
      # non-zero exit - and a check that fails without saying why is not a
      # check. The script reads the APK's own signing block, so there is no
      # second tool's output format to depend on, and it says what it could not
      # parse when it cannot parse it.
      - name: Verify the APK is signed with the release key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          GOT=$(node tools/apk-cert.js "$APK" --verbose) || {
            echo "could not read the APK's signing certificate (see above)" >&2; exit 1; }
          WANT=$(tr -d '[:space:]' < android/release-key.sha256 | tr 'A-F' 'a-f')
          echo "expected $WANT"
          echo "got      ${GOT:-<none>}"
          if [ "$GOT" != "$WANT" ]; then
            echo "SIGNING KEY MISMATCH. This APK cannot install over the last release;" >&2
            echo "Android would refuse it with 'The app wasn't installed'. Either the" >&2
            echo "secret changed or the key was rotated deliberately - if deliberately," >&2
            echo "update android/release-key.sha256 AND expect every existing install to" >&2
            echo "need one uninstall." >&2
            exit 1
          fi
          echo "signing key matches the released one"

      - name: Name the artifact after the tag
        run: cp android/app/build/outputs/apk/release/app-release.apk "saffron-road-${{ steps.v.outputs.tag }}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: saffron-road-apk
          path: saffron-road-*.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Saffron Road $TAG" --generate-notes
          gh release upload "$TAG" "saffron-road-${TAG}.apk" --clobber
