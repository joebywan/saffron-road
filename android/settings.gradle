/*
 * The Android build is a separate, self-contained Gradle build that sits
 * beside the web app rather than owning it. `../` — the repo root — is the
 * source of truth for every byte of the web app; see app/build.gradle.
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'SaffronRoad'
include ':app'
