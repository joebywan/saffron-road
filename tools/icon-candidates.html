<!doctype html><meta charset="utf-8"><title>Saffron Road — icon candidates</title>
<style>
 body{font:14px/1.45 system-ui,sans-serif;background:#0f141c;color:#e6ebf2;margin:0;padding:22px 26px 60px}
 h1{font-size:20px;margin:0 0 4px} h2{font-size:14px;margin:24px 0 8px;color:#9fb0c6;font-weight:650}
 p{color:#8fa0b6;max-width:78ch;font-size:13px;margin:3px 0 12px}
 .grid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
 .cell{text-align:center;font-size:10.5px;color:#8fa0b6}
 .lab{margin-top:6px}
 .row{background:#19202b;border:1px solid #2a3646;border-radius:10px;padding:14px 16px}
 .white{background:#fff;border-radius:10px;padding:14px 16px}
 svg{display:block;margin:0 auto}
 .circ{border-radius:50%;overflow:hidden}
 .sq{border-radius:22%;overflow:hidden}
</style>
<h1>Saffron Road — four marks</h1>
<p>Each is drawn once in a 24-unit box and shown at launcher and favicon sizes. The circle row is
Android's adaptive crop; the black row is the legibility floor — if a mark dies as a flat
silhouette it will die on a busy wallpaper too.</p>
<div id="out"></div>
<script type="module">
const BG='#1b1206', WARM='#D8551F', LITE='#F0863C', DEEP='#8C3410', SAND='#E8C489';
const MARKS = {
 'A — threads': {
  what:'The token itself, scaled up. Three strokes, the most distinctive outline in the set.',
  art:(c)=>`
   <path d="M6.6 4 Q11.4 12 8.4 20.6" fill="none" stroke="${c?DEEP:'#000'}" stroke-width="4.6" stroke-linecap="round"/>
   <path d="M12 3.2 Q13.6 12 12 20.8" fill="none" stroke="${c?DEEP:'#000'}" stroke-width="4.6" stroke-linecap="round"/>
   <path d="M17.4 4 Q12.6 12 15.6 20.6" fill="none" stroke="${c?DEEP:'#000'}" stroke-width="4.6" stroke-linecap="round"/>
   <path d="M6.6 4 Q11.4 12 8.4 20.6" fill="none" stroke="${c?WARM:'#000'}" stroke-width="2.8" stroke-linecap="round"/>
   <path d="M12 3.2 Q13.6 12 12 20.8" fill="none" stroke="${c?LITE:'#000'}" stroke-width="2.8" stroke-linecap="round"/>
   <path d="M17.4 4 Q12.6 12 15.6 20.6" fill="none" stroke="${c?WARM:'#000'}" stroke-width="2.8" stroke-linecap="round"/>`},
 'B — the road': {
  what:'A route narrowing to a horizon. Bold, reads instantly, but says "map" as much as "game".',
  art:(c)=>`
   <path d="M2.5 22 Q9 15 8.8 9.5 L15.2 9.5 Q15 15 21.5 22 Z" fill="${c?WARM:'#000'}"/>
   <path d="M11 21 L11.6 11 M13 21 L12.4 11" stroke="${c?SAND:'#fff'}" stroke-width="1.1" stroke-linecap="round" fill="none"/>
   <circle cx="12" cy="6" r="3.4" fill="${c?LITE:'#000'}"/>`},
 'C — thread road': {
  what:'One thread curving like a route, two flanking it. The name and the token in one shape.',
  art:(c)=>`
   <path d="M12 21.6 Q6.2 15.4 12 9.2 Q17.8 6 12 2.4" fill="none" stroke="${c?DEEP:'#000'}" stroke-width="5.4" stroke-linecap="round"/>
   <path d="M12 21.6 Q6.2 15.4 12 9.2 Q17.8 6 12 2.4" fill="none" stroke="${c?LITE:'#000'}" stroke-width="3.2" stroke-linecap="round"/>
   <path d="M6.6 20.4 Q4.4 15.6 6.8 11.4" fill="none" stroke="${c?WARM:'#000'}" stroke-width="2.6" stroke-linecap="round"/>
   <path d="M17.4 20.4 Q19.6 15.6 17.2 11.4" fill="none" stroke="${c?WARM:'#000'}" stroke-width="2.6" stroke-linecap="round"/>`},

 'E — caravan': {
  what:'A loaded camel. One solid mass, an outline nothing else in a launcher has, and unmistakably not a person.',
  art:(c)=>`
   <path d="M3.2 19.6 L4.4 14.2 Q4.9 12.2 6.6 12.2 L8.6 12.2 Q9.4 9.4 11.2 9.4 Q13 9.4 13.6 12.2
            L16.4 12.2 Q18.4 12.2 19 14.4 L20.6 19.6 L18.4 19.6 L17.2 15.4 L16.2 15.4 L16.9 19.6
            L14.8 19.6 L14.2 15.4 L9.4 15.4 L8.8 19.6 L6.7 19.6 L7.4 15.4 L6.4 15.4 L5.4 19.6 Z"
         fill="${c?WARM:'#000'}"/>
   <path d="M11.2 9.4 Q10.4 6.6 12.4 5.4 L14.6 4.4 Q15.6 4 15.6 5 L15.6 6.2"
         fill="none" stroke="${c?WARM:'#000'}" stroke-width="2.4" stroke-linecap="round"/>`},
 'F — the ribbon road': {
  what:'A winding route as a filled ribbon rather than a path to a horizon — no disc, so no pawn.',
  art:(c)=>`
   <path d="M7.6 21.8 Q7.2 16.4 11.4 14.6 Q16.4 12.6 15.8 7.4 Q15.4 4 11.6 2.6
            L13.4 0.9 Q18.9 2.9 19.3 7.3 Q20 13.7 14.2 16.2 Q10.6 17.8 10.9 21.8 Z"
         fill="${c?WARM:'#000'}"/>
   <circle cx="6.6" cy="20.6" r="2.6" fill="${c?LITE:'#000'}"/>`},
 'G — crocus': {
  what:'The saffron flower, one mass with the three stigmas cut OUT of it, so it stays a single shape.',
  art:(c)=>`
   <path d="M12 22 Q4.6 17.6 4.6 11.2 Q4.6 5.4 8.4 2.6 Q10 6 12 6 Q14 6 15.6 2.6
            Q19.4 5.4 19.4 11.2 Q19.4 17.6 12 22 Z" fill="${c?WARM:'#000'}"/>
   <path d="M9.2 9.6 Q8 14 9.6 18.4 M12 8.8 Q12 14 12 19 M14.8 9.6 Q16 14 14.4 18.4"
         fill="none" stroke="${c?BG:'#fff'}" stroke-width="1.5" stroke-linecap="round"/>`},
 'D — sun over road': {
  what:'A disc above a curving path. The most legible at 16px; the least specific to saffron.',
  art:(c)=>`
   <circle cx="12" cy="7.4" r="4.6" fill="${c?LITE:'#000'}"/>
   <path d="M3 21.4 Q12 13.2 21 21.4" fill="none" stroke="${c?WARM:'#000'}" stroke-width="4.2" stroke-linecap="round"/>
   <path d="M3 21.4 Q12 13.2 21 21.4" fill="none" stroke="${c?DEEP:'none'}" stroke-width="1.2" stroke-dasharray="1.6 2.4" stroke-linecap="round"/>`},
};
function icon(name, px, {colour=true, ground=true, shape='sq'}={}){
  const m=MARKS[name];
  return `<svg viewBox="0 0 24 24" width="${px}" height="${px}" class="${shape}"
    style="width:${px}px;height:${px}px;background:${ground?(colour?BG:'#fff'):'transparent'}">
    ${m.art(colour)}</svg>`;
}
const NAMES=Object.keys(MARKS);
const cell=(l,s)=>`<div class="cell">${s}<div class="lab">${l}</div></div>`;
const out=[];
for (const n of NAMES){
  out.push(`<h2>${n}</h2><p>${MARKS[n].what}</p>
   <div class="row"><div class="grid">
     ${cell('192 · store',  icon(n,192))}
     ${cell('96 · launcher',icon(n,96))}
     ${cell('48 · launcher',icon(n,48))}
     ${cell('32 · favicon', icon(n,32))}
     ${cell('16 · tab',     icon(n,16))}
     ${cell('adaptive crop',icon(n,96,{shape:'circ'}))}
   </div></div>`);
}
out.push(`<h2>All four as flat silhouettes — the legibility floor</h2>
 <p>No colour, no ground. A mark that dies here dies on a busy wallpaper.</p>
 <div class="white"><div class="grid">
  ${NAMES.map(n=>cell(n.split(' — ')[1], icon(n,84,{colour:false,ground:false}))).join('')}
 </div></div>
 <div class="white" style="margin-top:10px"><div class="grid">
  ${NAMES.map(n=>cell('48px', icon(n,48,{colour:false,ground:false}))).join('')}
 </div></div>`);
document.getElementById('out').innerHTML=out.join('');
</script>
